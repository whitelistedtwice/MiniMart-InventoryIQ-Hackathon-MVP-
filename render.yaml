services:
  - type: web
    name: inventoryiq-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash"
      - key: BUSINESS_NAME
        sync: false
      - key: BUSINESS_TYPE
        sync: false
      - key: BUSINESS_CURRENCY
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: SHEETS_PROBE_TIMEOUT_SECONDS
        value: "3"
      - key: SHEETS_CONNECTION_CACHE_TTL_SECONDS
        value: "60"
    healthCheckPath: /health
